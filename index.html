<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qrox</title>
  <meta name="description" content="Qrox is an AI assistant for chat, writing, code, file analysis and web search.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app collapsed" id="app">
    <aside class="sidebar" aria-label="Chat history">
      <div class="sidebar-head">
        <span class="sidebar-label">Chats</span>
        <button class="icon-btn" id="closeSidebar" type="button" aria-label="Close chats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <button class="new-chat" id="newChat" type="button" title="New chat (Ctrl/⌘ + K)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
      <input class="search-input" id="chatSearch" type="search" placeholder="Search chats" aria-label="Search chats">
      <nav class="chat-list" id="chatList" aria-label="Previous chats"></nav>
    </aside>

    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="toggleSidebar" type="button" aria-label="Show or hide chats" title="Chats (Ctrl/⌘ + B)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="brand">
          <img src="/logo.svg" alt="" width="26" height="26">
          <span>Qrox</span>
        </div>
        <div class="spacer"></div>
        <button class="icon-btn" id="exportBtn" type="button" aria-label="Export this chat" title="Export chat as Markdown">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        </button>
        <button class="icon-btn" id="helpBtn" type="button" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7"/><path d="M12 17h.01"/></svg>
        </button>
        <span class="model-tag">Qrox</span>
      </header>

      <main class="messages" id="messages">
        <div class="thread" id="thread"></div>
      </main>

      <button class="jump" id="jumpBtn" type="button" aria-label="Scroll to the latest message" title="Latest message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>

      <div class="composer-wrap">
        <form class="composer" id="composer" autocomplete="off">
          <div class="attachments hidden" id="attachments"></div>
          <textarea id="input" rows="1" placeholder="Ask Qrox anything" aria-label="Message Qrox"></textarea>
          <div class="composer-row">
            <button class="icon-btn" id="attachBtn" type="button" aria-label="Attach files" title="Attach files">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <input type="file" id="fileInput" multiple hidden
              accept="image/*,application/pdf,text/*,.md,.csv,.tsv,.json,.js,.ts,.jsx,.tsx,.py,.html,.css,.xml,.yml,.yaml,.sql,.java,.c,.cpp,.go,.rs,.rb,.php,.sh,.log">
            <button class="toggle" id="searchToggle" type="button" aria-pressed="false" title="Let Qrox search the web for current information">Web search</button>
            <button class="icon-btn" id="micBtn" type="button" aria-label="Voice input" title="Voice input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <span class="grow"></span>
            <button class="send" id="sendBtn" type="submit" aria-label="Send message" disabled>
              <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              <svg class="icon-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
            </button>
          </div>
        </form>
        <p class="footnote">Qrox can make mistakes. Check important information. Press ? for shortcuts.</p>
      </div>
    </div>

    <div class="drop-hint" aria-hidden="true">Drop files to attach them</div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="shortcuts" aria-labelledby="shortcutsTitle">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2 id="shortcutsTitle">Keyboard shortcuts</h2>
        <button class="icon-btn" id="closeShortcuts" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <dl class="keys">
        <div><dt><kbd>Enter</kbd></dt><dd>Send message</dd></div>
        <div><dt><kbd>Shift</kbd> + <kbd>Enter</kbd></dt><dd>New line</dd></div>
        <div><dt><kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>K</kbd></dt><dd>New chat</dd></div>
        <div><dt><kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>B</kbd></dt><dd>Show or hide chats</dd></div>
        <div><dt><kbd>/</kbd></dt><dd>Jump to the message box</dd></div>
        <div><dt><kbd>Esc</kbd></dt><dd>Stop a reply</dd></div>
        <div><dt><kbd>?</kbd></dt><dd>Show this list</dd></div>
      </dl>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
