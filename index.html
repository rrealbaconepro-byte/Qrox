<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qrox</title>
  <meta name="description" content="Qrox is an AI assistant for chat, writing, code, file analysis and web search.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app collapsed" id="app">
    <aside class="sidebar" aria-label="Chat history">
      <div class="sidebar-head">
        <span class="sidebar-label">Chats</span>
        <button class="icon-btn" id="closeSidebar" type="button" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
      <nav class="chat-list" id="chatList" aria-label="Previous chats"></nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="toggleSidebar" type="button" aria-label="Show or hide chat history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="brand">
          <img src="/logo.svg" alt="" width="26" height="26">
          <span>Qrox</span>
        </div>
        <div class="spacer"></div>
        <span class="model-tag">Qrox</span>
      </header>

      <main class="messages" id="messages">
        <div class="thread" id="thread"></div>
      </main>

      <div class="composer-wrap">
        <form class="composer" id="composer" autocomplete="off">
          <div class="attachments hidden" id="attachments"></div>
          <textarea id="input" rows="1" placeholder="Ask Qrox anything" aria-label="Message Qrox"></textarea>
          <div class="composer-row">
            <button class="icon-btn" id="attachBtn" type="button" aria-label="Attach files">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <input type="file" id="fileInput" multiple hidden
              accept="image/*,application/pdf,text/*,.md,.csv,.tsv,.json,.js,.ts,.jsx,.tsx,.py,.html,.css,.xml,.yml,.yaml,.sql,.java,.c,.cpp,.go,.rs,.rb,.php,.sh,.log">
            <button class="toggle" id="searchToggle" type="button" aria-pressed="false">Web search</button>
            <button class="icon-btn" id="micBtn" type="button" aria-label="Voice input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <span class="grow"></span>
            <button class="send" id="sendBtn" type="submit" aria-label="Send message" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </form>
        <p class="footnote">Qrox can make mistakes. Check important information.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
